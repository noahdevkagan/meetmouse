# Site-only deploy: publishes docs/ (meetmouse.com) without cutting an app
# release. Releases still deploy the site themselves (release.yml); this is
# for marketing/content changes that shouldn't wait for the next version.
# Runs when docs/ changes on main. The changelog page and sitemap are excluded:
# a release's "Changelog: X.Y.Z" push regenerates exactly those two, and the
# release deploys the site itself — the duplicate run here was cancelled
# (reported as a failure) on 0.29.0. Content edits that change the sitemap
# also change their page, so they still trigger.
name: Deploy site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "site/**"
      - "!docs/changelog.html"
      - "!docs/sitemap.xml"
      - ".github/workflows/deploy-site.yml"

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # sitemap lastmod comes from git history

      - name: Check generated pages are current and links resolve
        run: python3 site/build.py --check

      - name: Deploy docs/ to Cloudflare Pages (production branch)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set — site NOT deployed."
            exit 1
          fi
          # --branch main: production. Without it wrangler may publish a preview.
          npx -y wrangler pages deploy --branch main
