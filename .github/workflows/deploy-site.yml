# Site-only deploy: publishes docs/ (meetmouse.com) without cutting an app
# release. Releases still deploy the site themselves (release.yml); this is
# for marketing/content changes that shouldn't wait for the next version.
# Runs when docs/ changes on main (the changelog page is excluded: it ships
# with its release; "## Unreleased" notes are never rendered to it anyway).
name: Deploy site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "!docs/changelog.html"
      - ".github/workflows/deploy-site.yml"

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy docs/ to Cloudflare Pages (production branch)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set — site NOT deployed."
            exit 1
          fi
          # --branch main: production. Without it wrangler may publish a preview.
          npx -y wrangler pages deploy --branch main
