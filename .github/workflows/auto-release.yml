name: Auto release

# Pushing a "## X.Y.Z" changelog section to main IS the release: if the top
# numbered version in CHANGELOG.md has no tag yet, dispatch release.yml,
# which runs the gate, then PAUSES for approval in the `release` environment
# (Actions run -> Review deployments), then creates tag vX.Y.Z and ships.
# This workflow only dispatches; it never waits on the release run. No local tag push
# is needed (Claude Code's auto mode blocks those). Editing an already
# released section is a no-op because its tag exists.
#
# Dispatch rather than tag here: a tag pushed with GITHUB_TOKEN would not
# trigger release.yml's tag-push event.

on:
  push:
    branches: [main]
    paths: [CHANGELOG.md]

permissions:
  contents: read
  actions: write           # gh workflow run

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tags, for the already-released check

      - name: Dispatch release for a new changelog version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(grep -m1 -oE '^## [0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | cut -c4- || true)"
          if [ -z "$VERSION" ]; then
            echo "No numbered version in CHANGELOG.md — nothing to release."
            exit 0
          fi
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "v$VERSION is already tagged — nothing to release."
            exit 0
          fi
          # A release run may already be in flight: queued, running, or
          # waiting for approval in the `release` environment (status
          # "waiting"). Dispatched runs report headBranch "main", so match
          # any in-flight dispatch as well as a hand-pushed tag for this
          # version. Otherwise a second CHANGELOG.md push while a release
          # waits for approval would queue a duplicate.
          if gh run list --workflow release.yml --limit 20 \
               --json status,event,headBranch \
               --jq '.[] | select(.status != "completed") | select(.event == "workflow_dispatch" or .headBranch == "v'"$VERSION"'") | .headBranch' \
             | grep -q .; then
            echo "A release run is already in progress or awaiting approval."
            exit 0
          fi
          echo "Releasing v$VERSION"
          gh workflow run release.yml --ref main -f version="$VERSION"
