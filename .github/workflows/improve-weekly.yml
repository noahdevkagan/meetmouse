name: Improve coaching + transcripts (weekly)

# The self-improving loop (decisions.md 2026-11-02 "coaching feedback").
# Reads the aggregate of opted-in users' nudge ratings (ids and numbers only)
# from the web-share Worker, lets scripts/improve/propose.py nudge each
# signal's field multiplier by a bounded step, proves the app still builds
# and the nudge/feedback suites pass, then opens a PR with the evidence.
# Transcripts (decisions.md 2026-11-02 "transcript fixes"): the same run reads
# opted-in "Fix a misheard term" pairs taught on 3+ Macs and lets
# scripts/improve/merge_transcript_fixes.py add qualifying ones to
# Resources/common_corrections.json; tests/transcripts replays every entry.
# It NEVER merges: a human (or a reviewer you trust) approves each step.
#
# Needs repo secret FEEDBACK_ADMIN_TOKEN (same value as the Worker's
# ADMIN_TOKEN). Without it, or without enough data, the run exits green
# having changed nothing.

on:
  schedule:
    - cron: "23 14 * * 1"   # Mondays 14:23 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: improve-weekly
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.any.outputs.changed }}
      coaching: ${{ steps.propose.outputs.coaching }}
      transcripts: ${{ steps.transcripts.outputs.transcripts }}
    steps:
      - uses: actions/checkout@v4

      - name: Propose field-tuning changes
        id: propose
        env:
          FEEDBACK_ADMIN_TOKEN: ${{ secrets.FEEDBACK_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/improve/propose.py \
            --fetch https://meetmouse.com/api/admin/feedback-summary \
            --token-env FEEDBACK_ADMIN_TOKEN \
            --evidence evidence.md | tee propose.log
          tail -1 propose.log | sed 's/^changed=/coaching=/' >> "$GITHUB_OUTPUT"
          if [ -f evidence.md ]; then cat evidence.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Propose shared transcript corrections
        id: transcripts
        env:
          FEEDBACK_ADMIN_TOKEN: ${{ secrets.FEEDBACK_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/improve/merge_transcript_fixes.py \
            --fetch https://meetmouse.com/api/admin/transcript-fixes-summary \
            --token-env FEEDBACK_ADMIN_TOKEN \
            --report evidence-transcripts.md | tee merge.log
          tail -1 merge.log | sed 's/^changed=/transcripts=/' >> "$GITHUB_OUTPUT"
          if [ -f evidence-transcripts.md ]; then cat evidence-transcripts.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Anything to propose?
        id: any
        run: |
          if [ "${{ steps.propose.outputs.coaching }}" = "true" ] || [ "${{ steps.transcripts.outputs.transcripts }}" = "true" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pack the proposal
        if: steps.any.outputs.changed == 'true'
        run: |
          set -euo pipefail
          files=()
          for f in MeetingCoach/MeetingCoach/Engine/FieldTuning.swift bench/field-feedback.jsonl \
                   MeetingCoach/MeetingCoach/Resources/common_corrections.json \
                   evidence.md evidence-transcripts.md; do
            [ -f "$f" ] && files+=("$f")
          done
          tar czf proposal.tgz "${files[@]}"

      - name: Hand the proposal to the verify job
        if: steps.any.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: proposal
          path: proposal.tgz

  verify-and-open-pr:
    needs: propose
    if: needs.propose.outputs.changed == 'true'
    runs-on: macos-14
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: proposal
          path: proposal

      - name: Apply proposal
        run: |
          set -euo pipefail
          mkdir -p proposal-files
          tar xzf proposal/proposal.tgz -C proposal-files
          for f in MeetingCoach/MeetingCoach/Engine/FieldTuning.swift bench/field-feedback.jsonl \
                   MeetingCoach/MeetingCoach/Resources/common_corrections.json; do
            if [ -f "proposal-files/$f" ]; then cp "proposal-files/$f" "$f"; fi
          done
          git diff --stat

      - name: Select Xcode 16
        run: |
          set -euo pipefail
          XCODE_PATH="$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version

      - name: Build
        run: |
          set -euo pipefail
          brew install xcodegen
          cd MeetingCoach
          xcodegen
          xcodebuild -project MeetingCoach.xcodeproj -scheme MeetingCoach \
            -configuration Debug -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || { grep -E "(error|fatal error): " build.log | head -40; tail -60 build.log; exit 1; }
          grep -m1 "BUILD SUCCEEDED" build.log

      - name: Regression suites (must pass to open a PR)
        run: |
          set -euo pipefail
          bash tests/feedback/run.sh
          bash tests/transcripts/run.sh
          bash tests/nudges/run.sh
          bash tests/rubric/run.sh

      - name: Open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          branch="claude/improve-$(date -u +%Y-%m-%d)"
          git config user.name "meetmouse-improve-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          for f in MeetingCoach/MeetingCoach/Engine/FieldTuning.swift bench/field-feedback.jsonl \
                   MeetingCoach/MeetingCoach/Resources/common_corrections.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          git commit -m "Weekly improvements from opted-in coaching feedback and transcript fixes"
          git push -u origin "$branch"
          {
            if [ -f proposal-files/evidence.md ] && [ "${{ needs.propose.outputs.coaching }}" = "true" ]; then
              cat proposal-files/evidence.md; echo
            fi
            if [ -f proposal-files/evidence-transcripts.md ]; then
              cat proposal-files/evidence-transcripts.md; echo
            fi
            echo "Regression suites passed on macOS (feedback, transcripts, nudges, rubric) and the app builds."
            echo "Merging ships these changes in the next release. Nothing merges automatically."
          } > body.md
          gh pr create --base main --head "$branch" \
            --title "Weekly improvements $(date -u +%Y-%m-%d): coaching + transcripts" \
            --body-file body.md
          # PRs opened with GITHUB_TOKEN don't trigger push CI; dispatch the gate.
          gh workflow run test-gate.yml --ref "$branch" || true
